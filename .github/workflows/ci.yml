name: Flutter CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Analyze, test, and package check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify Flutter installation
        run: flutter --version

      - name: Get package dependencies
        run: flutter pub get

      - name: Check package formatting
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Analyze package
        run: flutter analyze

      - name: Test package
        run: flutter test

      - name: Get example dependencies
        working-directory: example
        run: flutter pub get

      - name: Analyze example
        working-directory: example
        run: flutter analyze

      - name: Test example
        working-directory: example
        run: flutter test

      - name: Validate package contents
        run: dart pub publish --dry-run
